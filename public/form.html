<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Form Handler - SentinelArg</title>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!-- Formulario de respaldo para Netlify Forms -->
  <form 
    name="demo-request" 
    method="POST" 
    netlify 
    data-netlify="true" 
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="demo-request" />
    
    <!-- Honeypot mejorado -->
    <div class="hidden">
      <label for="bot-field">Deja este campo vacío:</label>
      <input type="text" name="bot-field" id="bot-field" />
    </div>

    <!-- Campos reales (solo para detección de Netlify) -->
    <input type="text" name="name" required />
    <input type="email" name="email" required />
    <input type="text" name="company" required />
    <textarea name="message"></textarea>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
